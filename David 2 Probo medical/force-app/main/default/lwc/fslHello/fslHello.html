                                    <button
                                        type="button"
                                        class="sfs-list-group__toggle"
                                        data-group-key={group.key}
                                        onclick={handleToggleGroup}
                                    >
                                        <lightning-icon
                                            icon-name={group.toggleIcon}
                                            size="x-small"
                                            alternative-text={group.toggleLabel}
                                            class="sfs-list-group__toggle-icon"
                                        ></lightning-icon>
                                        <span>{group.toggleLabel}</span>
                                    </button>
                                </div>

                                <template if:false={group.isCollapsed}>
                                    <div class="sfs-list-group__cards">
                                        <template for:each={group.appointments} for:item="appt">
                                            <article
                                                key={appt.cardId}
                                                class={appt.cardClass}
                                                data-card-id={appt.cardId}
                                            >
                                                <c-fsl-work-order-card
                                                    appt={appt}
                                                    variant="pm"
                                                    is-crew-mode={isCrewMode}
                                                    show-ready-for-close-action={showReadyForCloseAction}
                                                    user-time-zone-id={userTimeZoneId}
                                                    onvisitselectionchange={handleVisitSelectionChange}
                                                    onmoreactionsselect={handleMoreActionsSelect}
                                                    onopenaccountmodal={openAccountModal}
                                                    onponumberdraftchange={handlePoNumberDraftChange}
                                                    onponumberkeydown={handlePoNumberKeydown}
                                                    onponumbersave={handlePoNumberSave}
                                                    onponumbercancel={handlePoNumberCancel}
                                                    onponumberedit={handlePoNumberEdit}
                                                    onservicesiteedit={handleServiceSiteEdit}
                                                    onservicesitecancel={handleServiceSiteCancel}
                                                    onservicesitedraftchange={handleServiceSiteDraftChange}
                                                    onservicesitekeydown={handleServiceSiteKeydown}
                                                    onservicesitesave={handleServiceSiteSave}
                                                    onlistinfoclick={handleListInfoClick}
                                                    onquoteattachmentclick={handleQuoteAttachmentClick}
                                                    onmarkquotesent={handleMarkQuoteSent}
                                                    onmarkrepairsent={handleMarkRepairSent}
                                                    onmarkpoattached={handleMarkPoAttached}
                                                    oncancelsale={handleCancelSale}
                                                    onapproverepair={handleApproveRepair}
                                                    onapproveexchange={handleApproveExchange}
                                                    ondeclinerepair={handleDeclineRepair}
                                                    onconfirmshipping={handleConfirmShipping}
                                                    onopenreportercontactmodal={openReporterContactModal}
                                                    onopenaddressmodal={openAddressModal}
                                                    onopenshippingaddressmodal={openShippingAddressModal}
                                                    oncopytracking={handleCopyTracking}
                                                    ontogglelistdetails={handleToggleListDetails}
                                                    ontogglequotelineitems={handleToggleQuoteLineItems}
                                                    onscheduleactionclick={handleScheduleActionClick}
                                                    ontogglequickschedulepanel={handleToggleQuickSchedulePanel}
                                                    onscheduleoncalendar={handleScheduleOnCalendar}
                                                    onquickschedulechange={handleQuickScheduleChange}
                                                    onquickschedule={handleQuickSchedule}
                                                    oncrewmemberchange={handleCrewMemberChange}
                                                    onassigntocrewmember={handleAssignToCrewMember}
                                                ></c-fsl-work-order-card>
                                            </article>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
            </template>

            <template if:false={hasPreventativeMaintenanceAppointments}>
                <div class="sfs-empty">
                        <p>{preventativeMaintenanceEmptyMessage}</p>
                </div>
            </template>
        </template>
        </template>

        <!-- CALENDAR TAB -->
        <template if:true={isCalendarTabActive}>
                <div class="sfs-header sfs-header-calendar">
                    <div class="sfs-calendar-nav">
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            alternative-text="Previous"
                            onclick={handleCalendarPrev}
                            class="sfs-calendar-nav-btn"
                        ></lightning-button-icon>
                        <span class="sfs-calendar-range">
                            {calendarRangeLabel}
                        </span>
                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            alternative-text="Next"
                            onclick={handleCalendarNext}
                            class="sfs-calendar-nav-btn"
                        ></lightning-button-icon>
                        <lightning-button
                            variant="base"
                            label="Today"
                            onclick={handleCalendarToday}
                            class="sfs-calendar-today-btn"
                        ></lightning-button>
                    </div>

                    <div class="sfs-calendar-mode-row">
                        <div class="sfs-calendar-mode">
                            <button
                                class={timelineModeClass}
                                type="button"
                                data-mode="timeline"
                                onclick={handleCalendarMode}
                            >
                                Timeline
                            </button>
                            <button
                                class={weekModeClass}
                                type="button"
                                data-mode="week"
                                onclick={handleCalendarMode}
                            >
                                Weeks
                            </button>
                        </div>
                        <template if:false={isDesktopFormFactor}>
                            <button
                                class={calendarPanButtonClass}
                                type="button"
                                aria-pressed={isCalendarPanMode}
                                onclick={handleCalendarPanToggle}
                            >
                                <span class="sfs-calendar-pan-label">Pan calendar</span>
                                <span class="sfs-calendar-pan-state">{calendarPanStateLabel}</span>
                            </button>
                        </template>
                        <lightning-button-icon
                            icon-name="utility:filterList"
                            alternative-text="Filters"
                            onclick={toggleFilters}
                            class={filterToggleClass}
                            variant="border-filled"
                        ></lightning-button-icon>
                    </div>
                </div>

                <template if:true={filtersOpen}>
                    <div class="sfs-filter-panel" role="region" aria-label="Filters">
                        <div class="sfs-filter-panel__field">
                            <span class="sfs-filter-panel__label">Search records</span>
                            <div class="sfs-filter-panel__input">
                                <lightning-input
                                    type="search"
                                    label="Search records"
                                    value={workOrderNumberFilter}
                                    onchange={handleWorkOrderNumberFilterChange}
                                    variant="label-hidden"
                                    placeholder="Search records"
                                    class="sfs-filter-panel__input-field"
                                ></lightning-input>
                                <template if:true={hasWorkOrderNumberFilter}>
                                    <button
                                        type="button"
                                        class="sfs-filter-clear"
                                        onclick={clearWorkOrderNumberFilter}
                                    >
                                        Clear
                                    </button>
                                </template>
                            </div>
                            <button
                                type="button"
                                class="sfs-search-help-toggle"
                                onclick={toggleSearchFieldGuide}
                            >
                                {searchFieldGuideToggleLabel}
                            </button>
                            <template if:true={showSearchFieldGuide}>
                                <p class="sfs-search-help-copy">
                                    Search fields: WO #, Opp #, Opportunity Name, Tracking #, Account Name, Serial #, PO Number, Customer ID, Part Name.
                                </p>
                            </template>
                        </div>
                        <template if:true={showCalendarSort}>
                            <div class="sfs-filter-panel__field">
                                <span class="sfs-filter-panel__label">Sort by</span>
                                <lightning-combobox
                                    name="unscheduledSort"
                                    label="Sort by"
                                    value={unscheduledSortValue}
                                    options={unscheduledSortOptions}
                                    onchange={handleUnscheduledSortChange}
                                    variant="label-hidden"
                                    class="sfs-filter-panel__select"
                                ></lightning-combobox>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Time zone label -->
                <template if:true={userTimeZoneShort}>
                    <div class="sfs-timezone-label">
                        Times shown in your Salesforce time zone: {userTimeZoneShort}
                    </div>
                </template>

                <template if:true={isManager}>
                    <div class="sfs-viewing-pill">{viewingAsLabel}</div>
                </template>

                <template if:true={isOffline}>
                    <div class="sfs-offline-banner">
                        <lightning-icon
                            icon-name="utility:offline"
                            size="x-small"
                            class="sfs-offline-icon"
                        ></lightning-icon>
                        <span>This tool only works when you are online.</span>
                    </div>
                </template>

                <template if:true={isLoading}>
                    <div class="sfs-loading">
                        <lightning-spinner alternative-text="Loading appointments"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <!-- TIMELINE MODE -->
                    <template if:true={isTimelineMode}>
                        <div class="sfs-calendar">
                            <!-- Global NOW line across the calendar -->
                            <template if:true={showNowLine}>
                                <div
                                    class="sfs-calendar-now-line"
                                    style={nowLineStyle}
                                ></div>
                            </template>

                            <div class="sfs-calendar-hours">
                                <template
                                    for:each={calendarHourLabels}
                                    for:item="hour"
                                >
                                    <div
                                        key={hour}
                                        class="sfs-calendar-hour-label"
                                    >
                                        {hour}
                                    </div>
                                </template>
                            </div>

                            <div class={calendarDaysWrapperClass}>
                                <div
                                    class={calendarDaysClass}
                                    onmousemove={handleCalendarPointerMove}
                                    onmouseup={handleCalendarPointerEnd}
                                    ontouchmove={handleCalendarPointerMove}
                                    ontouchend={handleCalendarPointerEnd}
                                >
                                    <template
                                        for:each={calendarDays}
                                        for:item="day"
                                        for:index="dayIndex"
                                    >
                                        <div
                                            key={day.key}
                                            class={day.cssClassTimeline}
                                            data-day-index={dayIndex}
                                        >
                                            <div class="sfs-calendar-day-header">
                                                {day.fullLabel}
                                            </div>
                                            <div class="sfs-calendar-day-body">
                                                <template
                                                    for:each={day.events}
                                                for:item="evt"
                                            >
                                                <div
                                                    key={evt.key}
                                                    class={evt.className}
                                                    style={evt.style}
                                                    data-id={evt.id}
                                                    data-kind={evt.kind}
                                                    data-day-index={dayIndex}
                                                    onclick={handleEventClick}
                                                    onmousedown={handleEventDragStart}
                                                    ontouchstart={handleEventDragStart}
                                                    onmouseup={handleEventPressEnd}
                                                    ontouchend={handleEventPressEnd}
                                                >
                                                    <!-- RED CREW WARNING BANNER -->
                                                    <template if:true={evt.isCrewAssignment}>
                                                        <div class="sfs-calendar-crew-banner">
                                                            Need Eng Assignment
                                                        </div>
                                                    </template>

                                                    <template if:false={evt.isAbsence}>
                                                        <button
                                                            class="sfs-unassign-btn sfs-unassign-btn_calendar"
                                                            title="Remove me from this work order"
                                                            data-id={evt.id}
                                                            onclick={handleUnassignClick}
                                                            type="button"
                                                        >
                                                            ✕
                                                        </button>
                                                    </template>

                                                    <template if:true={evt.isAbsence}>
                                                        <button
                                                            class="sfs-unassign-btn sfs-unassign-btn_calendar"
                                                            title="Delete absence"
                                                            data-id={evt.id}
                                                            onclick={handleDeleteAbsenceClick}
                                                            type="button"
                                                        >
                                                            ✕
                                                        </button>
                                                    </template>

                                                    <div class="sfs-calendar-event-title">
                                                        <template if:true={evt.workTypeSymbol}>
                                                            <span
                                                                class="sfs-calendar-event-symbol"
                                                                aria-hidden="true"
                                                            >
                                                                {evt.workTypeSymbol}
                                                            </span>
                                                        </template>
                                                        <span class="sfs-calendar-event-subject">
                                                            {evt.subject}
                                                        </span>
                                                    </div>

                                                    <template if:true={evt.workOrderNumber}>
                                                        <div class="sfs-calendar-event-wo">
                                                            {evt.workOrderNumber}
                                                        </div>
                                                    </template>

                                                    <div class="sfs-calendar-event-time">
                                                        {evt.timeLabel}
                                                    </div>

                                                    <template if:false={evt.isAbsence}>
                                                        <div
                                                            class="sfs-calendar-event-resize"
                                                            data-id={evt.id}
                                                            data-kind={evt.kind}
                                                            data-day-index={dayIndex}
                                                            onmousedown={handleEventResizeStart}
                                                            ontouchstart={handleEventResizeStart}
                                                        ></div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                </div>
                            </div>

                            <template if:true={isDragGhostVisible}>
                                <div
                                    class={dragGhostWrapperClass}
                                    style={dragGhostStyle}
                                    onpointerdown={handleGhostPointerDown}
                                >
                                    <div class={dragGhostClass}>
                                        <div class="sfs-calendar-event-title">
                                            {dragGhostTitle}
                                        </div>
                                        <div class="sfs-calendar-event-time">
                                            {dragGhostTime}
                                        </div>
                                    </div>
                                    <template if:true={showDragConfirmActions}>
                                        <div class="sfs-drag-ghost__actions">
                                            <button
                                                class="sfs-drag-ghost__action sfs-drag-ghost__action_confirm"
                                                onclick={confirmPendingSchedule}
                                                aria-label="Confirm schedule placement"
                                            >
                                                ✓
                                            </button>
                                            <button
                                                class="sfs-drag-ghost__action sfs-drag-ghost__action_cancel"
                                                onclick={cancelPendingSchedule}
                                                aria-label="Cancel schedule placement"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    </template>
                                    <template if:true={dragHelperText}>
                                        <div class="sfs-drag-ghost__hint">{dragHelperText}</div>
                                    </template>
                                </div>
                            </template>

                        </div>
                    </template>

                    <!-- WEEK MODE -->
                    <template if:true={isWeekMode}>
                        <div class="sfs-week-header-row">
                            <template
                                for:each={calendarHeaderDays}
                                for:item="day"
                            >
                                <div key={day.key} class="sfs-week-header-cell">
                                    {day.weekdayLabel}
                                </div>
                            </template>
                        </div>

                        <div class="sfs-weekgrid">
                            <template
                                for:each={calendarWeeks}
                                for:item="week"
                            >
                                <div key={week.key} class="sfs-week-row">
                                    <template
                                        for:each={week.days}
                                        for:item="day"
                                    >
                                        <div key={day.key} class={day.cssClassWeekCell}>
                                            <div class="sfs-week-cell-date">
                                                {day.dayNumberLabel}
                                            </div>
                                            <div class="sfs-week-cell-events">
                                                <template
                                                for:each={day.events}
                                                    for:item="evt"
                                                >
                                                    <div
                                                        key={evt.key}
                                                        class={evt.classNameWeek}
                                                        data-id={evt.id}
                                                        data-kind={evt.kind}
                                                        onclick={handleEventClick}
                                                    >
                                                        <!-- RED CREW WARNING BANNER -->
                                                        <template if:true={evt.isCrewAssignment}>
                                                            <div class="sfs-week-crew-banner">
                                                                Need Eng Assignment
                                                            </div>
                                                        </template>

                                                        <template if:false={evt.isAbsence}>
                                                            <button
                                                                class="sfs-unassign-btn sfs-unassign-btn_calendar"
                                                                title="Remove me from this work order"
                                                                data-id={evt.id}
                                                                onclick={handleUnassignClick}
                                                                type="button"
                                                            >
                                                                ✕
                                                            </button>
                                                        </template>

                                                        <template if:true={evt.isAbsence}>
                                                            <button
                                                                class="sfs-unassign-btn sfs-unassign-btn_calendar"
                                                                title="Delete absence"
                                                                data-id={evt.id}
                                                                onclick={handleDeleteAbsenceClick}
                                                                type="button"
                                                            >
                                                                ✕
                                                            </button>
                                                        </template>

                                                        <template if:true={evt.workOrderNumber}>
                                                            <div class="sfs-week-event-wo">
                                                                {evt.workOrderNumber}
                                                            </div>
                                                        </template>

                                                        <div class="sfs-week-event-time">
                                                            {evt.timeLabel}
                                                        </div>

                                                        <div class="sfs-week-event-title">
                                                            <template if:true={evt.workTypeSymbol}>
                                                                <span
                                                                    class="sfs-week-event-symbol"
                                                                    aria-hidden="true"
                                                                >
                                                                    {evt.workTypeSymbol}
                                                                </span>
                                                            </template>
                                                            <span class="sfs-week-event-subject">
                                                                {evt.subject}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                    </template>
                </template>

        </template>

        <template if:true={isManagerTabVisible}>
            <div class="sfs-manager-panel">
                <h3 class="sfs-manager-title">Manager console</h3>
                <p class="sfs-manager-copy">
                    Select a team member to view their lists and calendar.
                </p>

                <lightning-combobox
                    name="managerUser"
                    label="Team member"
                    options={managerOptions}
                    value={selectedManagerUserId}
                    onchange={handleManagerUserChange}
                ></lightning-combobox>

                <div class="sfs-actions sfs-manager-actions">
                    <lightning-button
                        variant="brand"
                        label="View as team member"
                        onclick={handleManagerApply}
                        disabled={managerApplyDisabled}
                    ></lightning-button>
                    <lightning-button
                        variant="neutral"
                        label="Return to my view"
                        onclick={handleManagerReset}
                        disabled={managerResetDisabled}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <!-- DETAIL OVERLAY / BOTTOM SHEET -->
        <template if:true={hasSelectedAppointment}>
            <div class="sfs-detail-overlay">
                <article
                    class={detailCardClass}
                >
                    <div class="sfs-detail-header">
                        <div class="sfs-detail-drag-handle"></div>
                        <button
                            class="sfs-detail-close"
                            type="button"
                            onclick={handleCloseDetails}
                        >
                            ✕
                        </button>
                    </div>

                    <h3 class="sfs-detail-title">
                        <button
                            type="button"
                            class="sfs-detail-title-link"
                            onclick={handleOpenWorkOrder}
                        >
                            {selectedAppointment.workOrderSubject}
                        </button>
                        <span class="sfs-detail-title-helper">
                            Click to open this work order in the app
                        </span>
                    </h3>

                    <template if:true={selectedAppointment.journey}>
                        <div class="sfs-detail-journey">
                            <div class="sfs-journey">
                                <div class="sfs-journey__header">
                                    <div class="sfs-journey__header-actions">
                                        <div class="sfs-journey__badges">
                                            <template if:true={selectedAppointment.journey.isOnHold}>
                                                <span class="sfs-journey__badge sfs-journey__badge_hold">
                                                    On Hold
                                                </span>
                                            </template>
                                        </div>
                                        <button
                                            class="sfs-journey__toggle"
                                            type="button"
                                            data-card-id={selectedAppointment.cardId}
                                            onclick={handleToggleJourney}
                                            aria-pressed={selectedAppointment.journeyExpanded}
                                            title={selectedAppointment.journeyToggleTitle}
                                        >
                                            {selectedAppointment.journeyToggleLabel}
                                        </button>
                                    </div>
                                </div>

                                <div class="sfs-journey__glance">
                                    <div
                                        class="sfs-journey__progress"
                                        role="progressbar"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                        aria-valuenow={selectedAppointment.journey.progressPercent}
                                        aria-label="Quote progress"
                                    >
                                        <div class="sfs-journey__progress-track">
                                            <span
                                                class="sfs-journey__progress-fill"
                                                style={selectedAppointment.journey.progressStyle}
                                            ></span>
                                        </div>
                                        <div class="sfs-journey__progress-meta">
                                            <span class="sfs-journey__compact-current">
                                                Current: {selectedAppointment.journey.currentLabel}
                                            </span>
                                            <span class="sfs-journey__compact-next">
                                                Next: {selectedAppointment.journey.nextLabel}
                                            </span>
                                        </div>
                                        <template if:true={selectedAppointment.probeSaleStatusDescription}>
                                            <p class="sfs-probe-sale-description">
                                                {selectedAppointment.probeSaleStatusDescription}
                                            </p>
                                        </template>
                                    </div>
                                    <div class="sfs-journey__compact-rail" role="list" aria-label="Key steps">
                                        <template if:true={selectedAppointment.journey.compactSummary.completedBefore}>
                                            <span class="sfs-journey__chip sfs-journey__chip_muted" role="listitem">
                                                +{selectedAppointment.journey.compactSummary.completedBefore} done
                                            </span>
                                        </template>
                                        <template
                                            for:each={selectedAppointment.journey.compactSummary.visibleSteps}
                                            for:item="step"
                                        >
                                            <span key={step.id} class={step.compactClass} role="listitem">
                                                {step.label}
                                            </span>
                                        </template>
                                        <template if:true={selectedAppointment.journey.compactSummary.upcomingAfter}>
                                            <span class="sfs-journey__chip sfs-journey__chip_muted" role="listitem">
                                                +{selectedAppointment.journey.compactSummary.upcomingAfter} upcoming
                                            </span>
                                        </template>
                                    </div>
                                </div>

                                <template if:true={selectedAppointment.journeyExpanded}>
                                    <div class="sfs-journey__rail" role="list" aria-label="Quote flow steps">
                                        <div class="sfs-journey__steps">
                                            <template
                                                for:each={selectedAppointment.journey.mainSteps}
                                                for:item="step"
                                            >
                                                <div key={step.id} class={step.className} role="listitem">
                                                    <span class="sfs-journey__dot"></span>
                                                    <span class="sfs-journey__label">{step.label}</span>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="sfs-journey__fade sfs-journey__fade_left"></div>
                                        <div class="sfs-journey__fade sfs-journey__fade_right"></div>
                                    </div>

                                    <template if:true={selectedAppointment.journey.hasDetour}>
                                        <div class="sfs-journey__detour">
                                            <div class="sfs-journey__rail-heading">
                                                <div class="sfs-journey__rail-title">
                                                    <span class="sfs-journey__detour-label">
                                                        {selectedAppointment.journey.detourLabel}
                                                    </span>
                                                </div>
                                                <template if:true={selectedAppointment.journey.detour.detourNext}>
                                                    <span class="sfs-journey__pill sfs-journey__pill_subtle">
                                                        Next: {selectedAppointment.journey.detour.detourNext.label}
                                                    </span>
                                                </template>
                                            </div>
                                            <div
                                                class="sfs-journey__rail sfs-journey__rail_detour"
                                                role="list"
                                                aria-label="Detour steps"
                                            >
                                                <div class="sfs-journey__steps sfs-journey__steps_detour">
                                                    <template
                                                        for:each={selectedAppointment.journey.detour.steps}
                                                        for:item="step"
                                                    >
                                                        <div
                                                            key={step.id}
                                                            class={step.className}
                                                            role="listitem"
                                                        >
                                                            <span class="sfs-journey__dot"></span>
                                                            <span class="sfs-journey__label">
                                                                {step.label}
                                                            </span>
                                                        </div>
                                                    </template>
                                                </div>
                                                <div class="sfs-journey__fade sfs-journey__fade_left"></div>
                                                <div class="sfs-journey__fade sfs-journey__fade_right"></div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- JOB SECTION -->
                    <div class="sfs-detail-section">
                        <div class="sfs-detail-section-title">Job</div>

                        <p class="sfs-detail-line">
                            <span class="sfs-detail-label">Subject</span>
                            <span class="sfs-detail-value">
                                {selectedAppointment.workOrderSubject}
                            </span>
                        </p>

                    <p class="sfs-detail-line">
                        <span class="sfs-detail-label">WO #</span>
                        <span class="sfs-detail-value">
                            <template if:true={selectedAppointment.workOrderNumber}>
                                {selectedAppointment.workOrderNumber}
                            </template>
                            <template if:false={selectedAppointment.workOrderNumber}>

                                <p class="sfs-modal-copy">
                                    Select the items that need to be returned.

                                    name="returnItems"

                                        variant="brand"
                                        label="Next"
                                        onclick={handleMarkForReturnNext}
                                        disabled={markForReturnNextDisabled}

                                    <lightning-button
                                        variant="neutral"
                                        label="Cancel"
                                        onclick={closeMarkForReturnModal}

                                </div>
                            </template>
                            <template if:false={hasMarkForReturnItems}>
                                <p class="sfs-modal-copy">
                                    No returnable line items were found on this work order.
                                </p>
                                <div class="sfs-actions sfs-modal-actions">
                                    <lightning-button
                                        variant="neutral"
                                        label="Close"
                                        onclick={closeMarkForReturnModal}
                                    ></lightning-button>
                                </div>
                            </template>
                        </template>

                            <p class="sfs-modal-copy">
                                Explain why each item is being returned.
                            </p>
                            <template for:each={markForReturnSelectedItems} for:item="returnItem">

                                    <lightning-textarea
                                        data-lineitemid={returnItem.lineItemId}
                                        label={returnItem.checkboxLabel}
                                        value={returnItem.reason}
                                        onchange={handleMarkForReturnReasonChange}
                                        placeholder="Reason for return"
                                        maxlength="500"
                                        required
                                    ></lightning-textarea>
                                </div>
                            </template>
                            <div class="sfs-actions sfs-modal-actions">
                                <lightning-button
                                    variant="brand"
                                    label="Submit"
                                    onclick={submitMarkForReturn}
                                    disabled={markForReturnSubmitDisabled}
                                ></lightning-button>
                                <lightning-button
                                    variant="neutral"
                                    label="Back"
                                    onclick={handleMarkForReturnBack}
                                ></lightning-button>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>
