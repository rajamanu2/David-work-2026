<template>
    <section class="sfs-container">
        <div class="sfs-tab-bar" role="tablist">
            <button
                type="button"
                class={listTabButtonClass}
                data-sfs-tab="list"
                onclick={handleTabButtonClick}
                aria-pressed={isListTabActive}
            >
                Sales & Service
            </button>
            <button
                type="button"
                class={preventativeMaintenanceTabButtonClass}
                data-sfs-tab="preventativeMaintenance"
                onclick={handleTabButtonClick}
                aria-pressed={isPreventativeMaintenanceTabActive}
            >
                PMs
            </button>
            <button
                type="button"
                class={recentTabButtonClass}
                data-sfs-tab="recent"
                onclick={handleTabButtonClick}
                aria-pressed={isRecentTabActive}
            >
                Recent
            </button>
            <button
                type="button"
                class={historyTabButtonClass}
                data-sfs-tab="history"
                onclick={handleTabButtonClick}
                aria-pressed={isHistoryTabActive}
            >
                History
            </button>
            <button
                type="button"
                class={rmaTabButtonClass}
                onclick={handleRmaTabClick}
                aria-pressed={isRmaTabActive}
            >
                RMAs
            </button>
            <button
                type="button"
                class={calendarTabButtonClass}
                data-sfs-tab="calendar"
                onclick={handleCalendarTabClick}
                onkeydown={handleCalendarTabKeydown}
                aria-pressed={isCalendarTabActive}
            >
                Calendar
            </button>
            <template if:true={isManager}>
                <button
                    type="button"
                    class={managerTabButtonClass}
                    data-sfs-tab="manager"
                    onclick={handleTabButtonClick}
                    aria-pressed={isManagerTabActive}
                >
                    Manager Console
                </button>
            </template>
        </div>

        <!-- LIST TAB (default) -->
        <template if:true={isListTabActive}>
                <div class="sfs-header">
                    <h2 class="sfs-title">Work Orders</h2>
                    <div class="sfs-header-actions">
                        <button
                            type="button"
                            class="slds-button slds-button_brand sfs-quick-quote-btn"
                            onclick={handleLaunchQuickQuoteFlow}
                        >
                            Quick Start
                        </button>
                        <lightning-button
                            variant="neutral"
                            label="Refresh"
                            onclick={handleRefresh}
                            class="sfs-refresh-btn"
                        ></lightning-button>
                    </div>
                </div>

                <template if:true={isManager}>
                    <div class="sfs-viewing-pill">{viewingAsLabel}</div>
                </template>

                <div class="sfs-opportunity-tabs" role="tablist" aria-label="Opportunity type">
                    <template for:each={opportunityTypeTabs} for:item="tab">
                        <button
                            key={tab.value}
                            type="button"
                            class={tab.className}
                            data-opportunity-type={tab.value}
                            onclick={handleOpportunityTypeChange}
                            aria-pressed={tab.isActive}
                            role="tab"
                        >
                            <span class="sfs-opportunity-tab__label">{tab.label}</span>
                            <span class={tab.countClass}>{tab.countLabel}</span>
                        </button>
                    </template>
                </div>

                <div class="sfs-list-mode">
                    <div class="sfs-list-mode__controls" role="presentation" aria-hidden="true">
                        <table class="sfs-list-mode__actions" role="presentation">
                            <tbody>
                            <tr>
                                <td class="sfs-list-mode__actions-cell sfs-list-mode__actions-cell--left">
                                    <div class="sfs-list-mode__icon-actions">
                                        <span class="sfs-list-mode__icon-action-wrap">
                                            <lightning-button-icon
                                                icon-name="utility:filterList"
                                                alternative-text="Filters"
                                                onclick={toggleFilters}
                                                class={filterToggleClass}
                                                variant="border-filled"
                                            ></lightning-button-icon>
                                        </span>
                                        <span class="sfs-list-mode__icon-action-wrap sfs-list-mode__icon-action-wrap--flag" style="padding-left: 20px;">
                                            <lightning-button-icon
                                                icon-name="utility:priority"
                                                alternative-text="Engineer action focus"
                                                title="Show only work orders currently in your court"
                                                onclick={toggleActionStatusFocus}
                                                class={actionStatusFocusToggleClass}
                                                variant="border-filled"
                                                aria-pressed={isActionStatusFocusEnabled}
                                            ></lightning-button-icon>
                                        </span>
                                    </div>
                                </td>
                                <td class="sfs-list-mode__actions-cell sfs-list-mode__actions-cell--right">
                                    <lightning-button
                                        variant="neutral"
                                        label="Collapse All"
                                        onclick={handleCollapseAllGroups}
                                        disabled={collapseAllDisabled}
                                        class="sfs-collapse-all-btn"
                                    ></lightning-button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <template if:true={showActionStatusFocusBanner}>
                        <div class="sfs-action-focus-banner" role="status">
                            {actionStatusFocusMessage}
                        </div>
                    </template>
                    <template if:true={filtersOpen}>
                        <div class="sfs-filter-panel" role="region" aria-label="Filters">
                            <div class="sfs-filter-panel__field sfs-filter-panel__field--wide">
                                <span class="sfs-filter-panel__label">Search records</span>
                                <div class="sfs-filter-panel__input">
                                    <lightning-input
                                        type="search"
                                        label="Search records"
                                        value={workOrderNumberFilter}
                                        onchange={handleWorkOrderNumberFilterChange}
                                        variant="label-hidden"
                                        placeholder="Search records"
                                        class="sfs-filter-panel__input-field"
                                    ></lightning-input>
                                    <template if:true={hasWorkOrderNumberFilter}>
                                        <button
                                            type="button"
                                            class="sfs-filter-clear"
                                            onclick={clearWorkOrderNumberFilter}
                                        >
                                            Clear
                                        </button>
                                    </template>
                                </div>
                                <button
                                    type="button"
                                    class="sfs-search-help-toggle"
                                    onclick={toggleSearchFieldGuide}
                                >
                                    {searchFieldGuideToggleLabel}
                                </button>
                                <template if:true={showSearchFieldGuide}>
                                    <p class="sfs-search-help-copy">
                                        Search fields: WO #, Opp #, Opportunity Name, Tracking #, Account Name, Service Site, Serial #, PO Number, Customer ID, Part Name.
                                    </p>
                                </template>
                            </div>
                            <template if:true={showListSort}>
                                <div class="sfs-filter-panel__field">
                                    <span class="sfs-filter-panel__label">Sort by</span>
                                    <lightning-combobox
                                        name="unscheduledSort"
                                        label="Sort by"
                                        value={unscheduledSortValue}
                                        options={unscheduledSortOptions}
                                        onchange={handleUnscheduledSortChange}
                                        variant="label-hidden"
                                        class="sfs-filter-panel__select"
                                    ></lightning-combobox>
                                </div>
                            </template>
                        </div>
                    </template>
                    <div class="sfs-list-mode-tabs" role="tablist" aria-label="Scheduled and unscheduled">
                        <template for:each={listModePrimaryTabs} for:item="tab">
                            <button
                                key={tab.value}
                                type="button"
                                class={tab.className}
                                data-list-mode-tab={tab.value}
                                onclick={handleListModePrimaryTabChange}
                                aria-pressed={tab.isActive}
                                role="tab"
                            >
                                <span>{tab.label}</span>
                            </button>
                        </template>
                    </div>
                    <div class="sfs-list-mode-chips" role="list">
                        <template for:each={listModeChips} for:item="chip">
                            <button
                                key={chip.value}
                                type="button"
                                class={chip.className}
                                data-mode={chip.value}
                                onclick={handleListModeChange}
                                aria-pressed={chip.isActive}
                                role="listitem"
                            >
                                <span class="sfs-mode-chip__label">{chip.label}</span>
                                <span class={chip.countClassName}>({chip.count})</span>
                            </button>
                        </template>
                    </div>
                </div>

                <template if:true={isOffline}>
                    <div class="sfs-offline-banner">
                        <lightning-icon
                            icon-name="utility:offline"
                            size="x-small"
                            class="sfs-offline-icon"
                        ></lightning-icon>
                        <span>This tool only works when you are online.</span>
                    </div>
                </template>

                <template if:true={isLoading}>
                    <div class="sfs-loading">
                        <lightning-spinner alternative-text="Loading appointments"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                        <template if:true={isTransferMode}>
                            <template if:true={transferRequestCount}>
                                <div class="sfs-list">
                                    <template for:each={sortedTransferRequests} for:item="req">
                                        <article key={req.transferRequestId} class="sfs-card sfs-transfer-card">
                                        <div class="sfs-card-header sfs-transfer-header">
                                            <span class="sfs-transfer-pill">Transfer Request</span>
                                            <template if:true={req.requestedByName}>
                                                <span class="sfs-transfer-requester">Requested by {req.requestedByName}</span>
                                            </template>
                                        </div>
                                        <div class="sfs-card-body">
                                            <div class="sfs-line">
                                                <span class="sfs-label">WO #</span>
                                                <span class="sfs-value">
                                                    <template if:true={req.workOrderNumber}>
                                                        {req.workOrderNumber}
                                                    </template>
                                                    <template if:false={req.workOrderNumber}>
                                                        —
                                                    </template>
                                                </span>
                                            </div>

                                            <p class="sfs-line sfs-anchor-row">
                                                <span class="sfs-label">Subject</span>
                                                <span class="sfs-value sfs-value_left">{req.workOrderSubject}</span>
                                            </p>
                                            <p class="sfs-transfer-account">
                                                {req.accountName}
                                            </p>

                                            <template if:true={req.fullAddress}>
                                                <p class="sfs-line sfs-line_address">
                                                    <span class="sfs-label">Site Address</span>
                                                    <span class="sfs-value sfs-value_address">
                                                        {req.fullAddress}
                                                    </span>
                                                </p>
                                            </template>
                                        </div>

                                        <div class="sfs-actions sfs-transfer-actions">
                                            <lightning-button
                                                variant="brand"
                                                label="Accept"
                                                data-id={req.transferRequestId}
                                                onclick={handleAcceptTransferRequest}
                                            ></lightning-button>
                                            <lightning-button
                                                variant="destructive"
                                                label="Reject"
                                                data-id={req.transferRequestId}
                                                onclick={openRejectModal}
                                            ></lightning-button>
                                            </div>
                                        </article>
                                    </template>
                                </div>
                            </template>
                            <template if:false={transferRequestCount}>
                                <div class="sfs-empty">
                                    <p>No transfer requests are waiting for you.</p>
                                </div>
                            </template>

                            <div class="sfs-transfer-subsection">
                                <div class="sfs-transfer-subsection-heading">
                                    <h3 class="sfs-transfer-subsection-title">Pending Requests</h3>
                                    <span class="sfs-transfer-count">
                                        ({submittedTransferRequestCount})
                                    </span>
                                </div>

                                <template if:true={submittedTransferRequestCount}>
                                    <div class="sfs-list">
                                        <template
                                            for:each={sortedSubmittedTransferRequests}
                                            for:item="req"
                                        >
                                            <article
                                                key={req.transferRequestId}
                                                class="sfs-card sfs-transfer-card"
                                            >
                                                <div class="sfs-card-header sfs-transfer-header">
                                                    <span class="sfs-transfer-pill sfs-transfer-pill_submitted">
                                                        Requested Transfer
                                                    </span>
                                                    <template if:true={req.targetName}>
                                                        <span class="sfs-transfer-requester">
                                                            To {req.targetName}
                                                        </span>
                                                    </template>
                                                </div>

                                                <div class="sfs-card-body">
                                                    <div class="sfs-line">
                                                        <span class="sfs-label">WO #</span>
                                                        <span class="sfs-value">
                                                            <template if:true={req.workOrderNumber}>
                                                                {req.workOrderNumber}
                                                            </template>
                                                            <template if:false={req.workOrderNumber}>
                                                                —
                                                            </template>
                                                        </span>
                                                    </div>

                                                    <p class="sfs-line sfs-anchor-row">
                                                        <span class="sfs-label">Subject</span>
                                                        <span class="sfs-value sfs-value_left">{req.workOrderSubject}</span>
                                                    </p>
                                                    <p class="sfs-transfer-account">
                                                        {req.accountName}
                                                    </p>

                                                    <template if:true={req.fullAddress}>
                                                        <p class="sfs-line sfs-line_address">
                                                            <span class="sfs-label">Site Address</span>
                                                            <span class="sfs-value sfs-value_address">
                                                                {req.fullAddress}
                                                            </span>
                                                        </p>
                                                    </template>
                                                </div>

                                                <div class="sfs-transfer-status">
                                                    <span class={req.statusClass}>{req.statusLabel}</span>
                                                    <template if:true={req.rejectionReason}>
                                                        <p class="sfs-transfer-status-reason">
                                                            Reason: {req.rejectionReason}
                                                        </p>
                                                    </template>
                                                </div>
                                            </article>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={submittedTransferRequestCount}>
                                    <div class="sfs-empty">
                                        <p>You have not sent any transfer requests yet.</p>
                                    </div>
                                </template>
                            </div>
                        </template>

                    <template if:false={isTransferMode}>
                        <template if:true={hasVisibleAppointments}>
                            <div class="sfs-list">
                                <template for:each={paginatedAppointmentGroups} for:item="group">
                                    <div key={group.key} class="sfs-list-group">
                                        <div class="sfs-list-group__header">
                                            <div class="sfs-list-group__title">
                                                <span class="sfs-list-group__label">{group.label}</span>
                                                <span class="sfs-list-group__count">({group.count})</span>
                                            </div>
                                            <button
                                                type="button"
                                                class="sfs-list-group__toggle"
                                                data-group-key={group.key}
                                                onclick={handleToggleGroup}
                                            >
                                                <lightning-icon
                                                    icon-name={group.toggleIcon}
                                                    size="x-small"
                                                    alternative-text={group.toggleLabel}
                                                    class="sfs-list-group__toggle-icon"
                                                ></lightning-icon>
                                                <span>{group.toggleLabel}</span>
                                            </button>
                                        </div>

                                        <template if:false={group.isCollapsed}>
                                            <div class="sfs-list-group__cards">
                                                <template for:each={group.appointments} for:item="appt">
                                                    <article
                                                        key={appt.cardId}
                                                        class={appt.cardClass}
                                                        data-card-id={appt.cardId}
                                                        data-card-variant="reduced"
                                                    >
                                                        <c-fsl-work-order-card
                                                            appt={appt}
                                                            variant="reduced"
                                                            is-crew-mode={isCrewMode}
                                                            show-ready-for-close-action={showReadyForCloseAction}
                                                            user-time-zone-id={userTimeZoneId}
                                                            onvisitselectionchange={handleVisitSelectionChange}
                                                            onmoreactionsselect={handleMoreActionsSelect}
                                                            onopenaccountmodal={openAccountModal}
                                                            onponumberdraftchange={handlePoNumberDraftChange}
                                                            onponumberkeydown={handlePoNumberKeydown}
                                                            onponumbersave={handlePoNumberSave}
                                                            onponumbercancel={handlePoNumberCancel}
                                                            onponumberedit={handlePoNumberEdit}
                                                            onservicesiteedit={handleServiceSiteEdit}
                                                            onservicesitecancel={handleServiceSiteCancel}
                                                            onservicesitedraftchange={handleServiceSiteDraftChange}
                                                            onservicesitekeydown={handleServiceSiteKeydown}
                                                            onservicesitesave={handleServiceSiteSave}
                                                            onlistinfoclick={handleListInfoClick}
                                                            onquoteattachmentclick={handleQuoteAttachmentClick}
                                                            onmarkquotesent={handleMarkQuoteSent}
                                                            onmarkrepairsent={handleMarkRepairSent}
                                                            onmarkpoattached={handleMarkPoAttached}
                                                            oncancelsale={handleCancelSale}
                                                            onapproverepair={handleApproveRepair}
                                                            onapproveexchange={handleApproveExchange}
                                                            ondeclinerepair={handleDeclineRepair}
                                                            onconfirmshipping={handleConfirmShipping}
                                                            onopenreportercontactmodal={openReporterContactModal}
                                                            onopenaddressmodal={openAddressModal}
                                                            onopenshippingaddressmodal={openShippingAddressModal}
                                                            oncopytracking={handleCopyTracking}
                                                            ontogglelistdetails={handleToggleListDetails}
                                                            ontogglequotelineitems={handleToggleQuoteLineItems}
                                                            onscheduleactionclick={handleScheduleActionClick}
                                                            ontogglequickschedulepanel={handleToggleQuickSchedulePanel}
                                                            onscheduleoncalendar={handleScheduleOnCalendar}
                                                            onquickschedulechange={handleQuickScheduleChange}
                                                            onquickschedule={handleQuickSchedule}
                                                            oncrewmemberchange={handleCrewMemberChange}
                                                            onassigntocrewmember={handleAssignToCrewMember}
                                                        ></c-fsl-work-order-card>
                                                    </article>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:true={hasMoreListItems}>
                                    <div class="sfs-list-sentinel"></div>
                                </template>
                            </div>
                        </template>

                        <template if:false={hasAppointments}>
                            <div class="sfs-empty">
                                <p>No service appointments were found for your resource.</p>
                            </div>
                        </template>
                    </template>
                </template>
        </template>

        <!-- RECENT TAB -->
        <template if:true={isRecentTabActive}>
            <div class="sfs-header">
                <h2 class="sfs-title">Recently Modified Work Orders</h2>
                <table class="sfs-header-actions-table" role="presentation">
                    <tbody>
                    <tr>
                        <td class="sfs-header-actions-cell sfs-header-actions-cell--left">
                            <lightning-button-icon
                                icon-name="utility:filterList"
                                alternative-text="Filters"
                                onclick={toggleFilters}
                                class={filterToggleClass}
                                variant="border-filled"
                            ></lightning-button-icon>
                        </td>
                        <td class="sfs-header-actions-cell sfs-header-actions-cell--right">
                            <lightning-button
                                variant="neutral"
                                label="Refresh"
                                onclick={handleRefresh}
                                class="sfs-refresh-btn"
                            ></lightning-button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <template if:true={filtersOpen}>
                <div class="sfs-filter-panel" role="region" aria-label="Filters">
                    <div class="sfs-filter-panel__field">
                        <span class="sfs-filter-panel__label">Search records</span>
                        <div class="sfs-filter-panel__input">
                            <lightning-input
                                type="search"
                                label="Search records"
                                value={workOrderNumberFilter}
                                onchange={handleWorkOrderNumberFilterChange}
                                variant="label-hidden"
                                placeholder="Search records"
                                class="sfs-filter-panel__input-field"
                            ></lightning-input>
                            <template if:true={hasWorkOrderNumberFilter}>
                                <button
                                    type="button"
                                    class="sfs-filter-clear"
                                    onclick={clearWorkOrderNumberFilter}
                                >
                                    Clear
                                </button>
                            </template>
                        </div>
                        <button
                            type="button"
                            class="sfs-search-help-toggle"
                            onclick={toggleSearchFieldGuide}
                        >
                            {searchFieldGuideToggleLabel}
                        </button>
                        <template if:true={showSearchFieldGuide}>
                            <p class="sfs-search-help-copy">
                                Search fields: WO #, Opp #, Opportunity Name, Tracking #, Account Name, Service Site, Serial #, PO Number, Customer ID, Part Name.
                            </p>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={isOffline}>
                <div class="sfs-offline-banner">
                    <lightning-icon
                        icon-name="utility:offline"
                        size="x-small"
                        class="sfs-offline-icon"
                    ></lightning-icon>
                    <span>This tool only works when you are online.</span>
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="sfs-loading">
                    <lightning-spinner alternative-text="Loading appointments"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <div class="sfs-list-mode-tabs" role="tablist" aria-label="Recent activity type">
                    <template for:each={recentModeTabs} for:item="tab">
                        <button
                            key={tab.value}
                            type="button"
                            class={tab.className}
                            data-recent-mode-tab={tab.value}
                            onclick={handleRecentModeTabClick}
                            aria-pressed={tab.isActive}
                            role="tab"
                        >
                            <span>{tab.label}</span>
                            <span class="sfs-list-mode-tabs__count">{tab.countLabel}</span>
                        </button>
                    </template>
                </div>
                <template if:true={hasRecentWorkOrders}>
                    <div class="sfs-list">
                        <template for:each={recentWorkOrderGroups} for:item="group">
                            <div key={group.key} class="sfs-list-group">
                                <div class="sfs-list-group__header">
                                    <div class="sfs-list-group__title">
                                        <span class="sfs-list-group__label">{group.label}</span>
                                        <span class="sfs-list-group__count">({group.count})</span>
                                    </div>
                                    <button
                                        type="button"
                                        class="sfs-list-group__toggle"
                                        data-group-key={group.key}
                                        onclick={handleToggleGroup}
                                    >
                                        <lightning-icon
                                            icon-name={group.toggleIcon}
                                            size="x-small"
                                            alternative-text={group.toggleLabel}
                                            class="sfs-list-group__toggle-icon"
                                        ></lightning-icon>
                                        <span>{group.toggleLabel}</span>
                                    </button>
                                </div>

                                <template if:false={group.isCollapsed}>
                                    <div class="sfs-list-group__cards">
                                        <template for:each={group.appointments} for:item="appt">
                                            <article
                                                        key={appt.cardId}
                                                        class={appt.cardClass}
                                                        data-card-id={appt.cardId}
                                                    >
                                                        <c-fsl-work-order-card
                                                            appt={appt}
                                                            variant="recent"
                                                            is-crew-mode={isCrewMode}
                                                            show-ready-for-close-action={showReadyForCloseAction}
                                                            user-time-zone-id={userTimeZoneId}
                                                            onvisitselectionchange={handleVisitSelectionChange}
                                                            onmoreactionsselect={handleMoreActionsSelect}
                                                            onopenaccountmodal={openAccountModal}
                                                            onponumberdraftchange={handlePoNumberDraftChange}
                                                            onponumberkeydown={handlePoNumberKeydown}
                                                            onponumbersave={handlePoNumberSave}
                                                            onponumbercancel={handlePoNumberCancel}
                                                            onponumberedit={handlePoNumberEdit}
                                                            onservicesiteedit={handleServiceSiteEdit}
                                                            onservicesitecancel={handleServiceSiteCancel}
                                                            onservicesitedraftchange={handleServiceSiteDraftChange}
                                                            onservicesitekeydown={handleServiceSiteKeydown}
                                                            onservicesitesave={handleServiceSiteSave}
                                                            onlistinfoclick={handleListInfoClick}
                                                            onquoteattachmentclick={handleQuoteAttachmentClick}
                                                            onmarkquotesent={handleMarkQuoteSent}
                                                            onmarkrepairsent={handleMarkRepairSent}
                                                            onmarkpoattached={handleMarkPoAttached}
                                                            oncancelsale={handleCancelSale}
                                                            onapproverepair={handleApproveRepair}
                                                            onapproveexchange={handleApproveExchange}
                                                            ondeclinerepair={handleDeclineRepair}
                                                            onconfirmshipping={handleConfirmShipping}
                                                            onopenreportercontactmodal={openReporterContactModal}
                                                            onopenaddressmodal={openAddressModal}
                                                            onopenshippingaddressmodal={openShippingAddressModal}
                                                            oncopytracking={handleCopyTracking}
                                                            ontogglelistdetails={handleToggleListDetails}
                                                            ontogglequotelineitems={handleToggleQuoteLineItems}
                                                            onscheduleactionclick={handleScheduleActionClick}
                                                            ontogglequickschedulepanel={handleToggleQuickSchedulePanel}
                                                            onscheduleoncalendar={handleScheduleOnCalendar}
                                                            onquickschedulechange={handleQuickScheduleChange}
                                                            onquickschedule={handleQuickSchedule}
                                                            oncrewmemberchange={handleCrewMemberChange}
                                                            onassigntocrewmember={handleAssignToCrewMember}
                                                        ></c-fsl-work-order-card>
                                                    </article>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={hasRecentWorkOrders}>
                    <div class="sfs-empty">

        <!-- RMA TAB -->
        <template if:true={isRmaTabActive}>
            <div class="sfs-header">
                <h2 class="sfs-title">My RMAs</h2>
                <div class="sfs-header-actions">
                    <lightning-button

                        class="sfs-refresh-btn"
                    ></lightning-button>
                </div>
            </div>

            <div class="sfs-history-filters">
                <lightning-input
                    type="search"
                    label="Search"
                    placeholder="Search RMAs"
                    value={rmaSearchInput}
                    onchange={handleRmaFilterChange}
                    oninput={handleRmaFilterChange}
                    disabled={isRmaSearchDisabled}
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Hide items with tracking"
                    checked={rmaExcludeTracked}
                    onchange={handleRmaExcludeTrackedChange}

                ></lightning-input>

            <template if:true={isRmaLoading}>

                    <lightning-spinner alternative-text="Loading RMAs"></lightning-spinner>

            </template>

            <template if:false={isRmaLoading}>
                <template if:true={hasRmaItems}>

                                    <template if:true={rma.rmaType}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Type</span>
                                            <span class="sfs-history-card__line-value">{rma.rmaType}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.createdLabel}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Created</span>
                                            <span class="sfs-history-card__line-value">{rma.createdLabel}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.accountName}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Account</span>
                                            <span class="sfs-history-card__line-value">{rma.accountName}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.opportunityName}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Opportunity</span>
                                            <span class="sfs-history-card__line-value">{rma.opportunityName}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.workOrderNumber}>
                                        <div class="sfs-rma-card__cell sfs-rma-card__cell--full">
                                            <span class="sfs-history-card__line-label">Work Order</span>
                                            <span class="sfs-history-card__line-value">{rma.workOrderNumber}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.assetProductName}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Asset</span>
                                            <span class="sfs-history-card__line-value">{rma.assetProductName}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.serialNumber}>
                                        <div class="sfs-rma-card__cell">
                                            <span class="sfs-history-card__line-label">Serial #</span>
                                            <span class="sfs-history-card__line-value">{rma.serialNumber}</span>
                                        </div>
                                    </template>
                                    <template if:true={rma.isLoanerReturn}>
                                        <template if:true={rma.loanerProbeModel}>
                                            <div class="sfs-rma-card__cell">
                                                <span class="sfs-history-card__line-label">Probe Model</span>
                                                <span class="sfs-history-card__line-value">{rma.loanerProbeModel}</span>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={rma.rmaTracking}>
                                        <div class="sfs-rma-card__cell sfs-rma-card__cell--full">
                                            <span class="sfs-history-card__line-label">RMA Tracking #</span>
                                            <span class="sfs-history-card__line-value">{rma.rmaTracking}</span>
                                        </div>
                                    </template>
                                </div>

                                <template if:true={rma.showEngineerTrackingBlock}>

                                                    type="text"
                                                    label="Engineer RMA Tracking #"
                                                    variant="label-hidden"
                                                    value={rma.engineerTrackingDraft}
                                                    data-rma-id={rma.rmaId}
                                                    oninput={handleRmaTrackingInput}
                                                    placeholder="Add tracking #"
                                                    class="sfs-rma-tracking-input"
                                                ></lightning-input>
                                                <lightning-button
                                                    variant="brand"
                                                    label="Save"
                                                    data-rma-id={rma.rmaId}
                                                    onclick={handleRmaTrackingSave}

                                                ></lightning-button>
                                            </div>
                                        </template>
                                        <template if:false={rma.isEditingEngineerTracking}>
                                            <div class="sfs-rma-tracking-value-row">
                                                <span class="sfs-history-card__line-value">{rma.engineerRmaTracking}</span>
                                                <lightning-button-icon
                                                    icon-name="utility:edit"
                                                    alternative-text="Edit tracking number"
                                                    variant="bare"
                                                    size="small"
                                                    data-rma-id={rma.rmaId}

                                                    class="sfs-rma-tracking-edit-btn"
                                                ></lightning-button-icon>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                </template>
                <template if:false={hasRmaItems}>
                    <div class="sfs-empty">
                        <p>{rmaEmptyMessage}</p>
                    </div>
                </template>
