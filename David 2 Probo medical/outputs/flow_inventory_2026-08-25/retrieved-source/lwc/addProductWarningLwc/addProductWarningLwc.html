<template>
    <div class="slds-grid slds-wrap" style="margin-left:2%">
        <div class="slds-col slds-size_1-of-1">
            <p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{warningHeader}' class="slds-text-color_error" style="font-weight: bold"></lightning-formatted-text></p>          
            <p class="slds-text-body_regular"><lightning-formatted-text value='{warningMessage}' class="slds-text-color_error"></lightning-formatted-text></p>          
        </div>        
        <div class="slds-col slds-size_1-of-1" style="text-align: center; margin-top: 2%;">
                <template if:true={displayConfimationButton}>
                        <lightning-button variant="brand" label="Confirm" title="Confirm" name="confirmWarning"  onclick={handleConfirm} class="slds-m-left_x-small"></lightning-button> 
                </template>
                <lightning-button variant="brand" label='{cancelButtonLabel}' title='{cancelButtonLabel}' name="closeWarning"  onclick={handleClose} class="slds-m-left_x-small"></lightning-button>
        </div>  
    </div> 
</template>
