<template>
    <lightning-layout-item size=12>
        <div>
            <template if:true={selections.showModal}>
                <c-oli-modal-lwc oncontinuedeselection={handleNewAssetDeselection}  onclosemodal={handleModalClose}> </c-oli-modal-lwc> 
            </template>
        </div>
        <div class="slds-table--header-fixed_container" style="height:300px; width: 1500px;">      
            <div class="slds-scrollable_y" style="height:100%; overflow: visible !important;">
                <template if:true={newAssetDataAvailable}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table--header-fixed" style="empty-cells: show; width: 100%;">
                        <thead>  
                            <tr style="margin-bottom: 1%;">
                                <th class="" scope="col" title="Deselect"><div class="slds-truncate slds-cell-fixed" title="Item Deselection">&nbsp;</div></th>
                                <th class="" scope="col" title="Part No"><div class="slds-truncate slds-cell-fixed" title=">Part No">Part No</div></th>
                                <th class="" scope="col" title="Product Name"><div class="slds-truncate slds-cell-fixed" title="Product Name">Product Name</div></th>
                                <th class="" scope="col" title="Quantity"><div class="slds-truncate slds-cell-fixed" title="Quantity">Quantity</div></th>
                               <!-- <th class="" scope="col" title="Part Status"><div class="slds-truncate slds-cell-fixed" title="Part Status">Part Status</div></th>-->
                                <th class="" scope="col" title="Sub Location"> <div class="slds-truncate slds-cell-fixed" title="Sub Location">Sub Location</div></th>
                                <th class="" scope="col" title="Serial Number"> <div class="slds-truncate slds-cell-fixed" title="Serial Number">Serial Number</div></th>
                                <th class="" scope="col" title="Functional Rating"> <div class="slds-truncate slds-cell-fixed" title="Functional Rating">Functional Rating</div></th>
                                <th class="" scope="col" title="Cosmetic Rating"> <div class="slds-truncate slds-cell-fixed" title="Cosmetic Rating">Cosmetic Rating</div></th>
                                <th class="" scope="col" title="Date of Manufacture"> <div class="slds-truncate slds-cell-fixed" title="Date Of Manufacture">DOM</div></th>
                                <th class="" scope="col" title="Tube Count"> <div class="slds-truncate slds-cell-fixed" title="Tube Count">Tube Count</div></th>
                                <th class="" scope="col" title="Tube Count Date"> <div class="slds-truncate slds-cell-fixed" title="Tube Count Date">Tube Count Date</div></th>
                                
                            </tr>  
                        </thead>
                        <tbody>
                            <template for:each={newAssetEditedData} for:item='item'>
                                    <tr class="slds-hint-parent" key={item.id} >
                                        <td>
                                            <lightning-button variant="destructive" label="Deselect" title="Deselect" value={item.id} onclick={handleModalOpen} class="slds-var-m-left_x-small"></lightning-button>
                                        </td>
                                        <td data-label="Part No" style="min-width: 80px; max-width: none" class="slds-text-align_left">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.data.Part_Number__c}'></lightning-formatted-text></div>
                                        </td>
                                        <td data-label="Product Name" style="min-width: 150px; max-width: none;" class="slds-text-align_left">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.data.Name}'></lightning-formatted-text></div>
                                        </td>
                                        <td data-label="Quantity" style="min-width: 50px; max-width: 80px;" class="slds-text-align_left" title="Quantity">
                                            <div class="slds-truncate" key={item.id}><lightning-input type="number" value='{item.quantity}' data-key={item.id} onchange={handleQuantityChange}></lightning-input></div>
                                        </td> 
                                       <!-- <td data-label="Part Status" style="min-width: 80px; max-width: none" class="slds-text-align_left">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.partStatus}'></lightning-formatted-text></div>
                                        </td>-->
                                        <td data-label="Sub Location" style="min-width: 150px; max-width:none;" class="slds-text-align_left" >
                                            <div key={item.id} style="overflow: inherit; position: static !important;"><lightning-combobox placeholder="-None-" value='{item.partSubLocation}' options={subLocationOptions} variant="label-hidden"  name={item.id} data-key={item.id} onload={getsubLocationOptions} onchange={handleSubLocationChange}></lightning-combobox></div>
                                        </td> 
                                        <td data-label="Serial Number" style="min-width: 80px; max-width: 100px;" class="slds-text-align_left" title="Serial Number">
                                            <div class="slds-truncate" key={item.id}><lightning-input data-key={item.id} onchange={handleSerialNumberChange}></lightning-input></div>
                                        </td> 
                                        <td data-label="Functional Rating" style="min-width: 150px; max-width: none;" class="slds-text-align_left">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.functionalRating}'></lightning-formatted-text></div>
                                        </td>
                                        <td data-label="Cosmetic Rating" style="min-width: 150px; max-width:none;" class="slds-text-align_left" >
                                            <div key={item.id} style="overflow: inherit; position: static !important;"><lightning-combobox placeholder="-None-" value='{item.cosmeticRating}' options={cosmeticRatingOptions} variant="label-hidden"  name={item.id} data-key={item.id} onload={getcosmeticRatingOptions} onchange={handleCosmeticRatingChange}></lightning-combobox></div>
                                        </td>
                                        <td data-label="Date of Manufacture" style="min-width: 80px; max-width: 100px;" class="slds-text-align_left" title="Date of Manufacture">
                                            <div class="slds-truncate" key={item.id}><lightning-input value='{item.dateOfManufacture}' data-key={item.id} onchange={handleDateOfManufactureChange}></lightning-input></div>
                                        </td>  
                                        <td data-label="Tube Count" style="min-width: 80px; max-width: 100px;" class="slds-text-align_left" title="Tube Count">
                                            <div class="slds-truncate" key={item.id}><lightning-input value='{item.tubeCount}' data-key={item.id} onchange={handleTubeCountChange}></lightning-input></div>
                                        </td> 
                                        <td data-label="Tube Count Date" style="min-width: 80px; max-width: 100px;" class="slds-text-align_left" title="Tube Count Date">
                                            <div class="slds-truncate" key={item.id}><lightning-input type="date" value='{item.tubeCountDate}' data-key={item.id} onchange={handleTubeCountDateChange}></lightning-input></div>
                                        </td> 
                                    </tr>    
                            </template>
                        </tbody>  
                    </table>
                </template>
            </div>
        </div>
    </lightning-layout-item>    
</template>
