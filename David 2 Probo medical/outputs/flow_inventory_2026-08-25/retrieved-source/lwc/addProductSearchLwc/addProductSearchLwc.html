<template>
    <template if:false={hideSpinner}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
    <template if:true={hideSpinner}>
        <template if:true={messages.warningMessageAvailable}>
                <c-add-product-warning-lwc header={messages.warningHeader} message={messages.warningMessage} cancel-label={messages.closeButtonLabel} show-confirm={messages.showConfirmationButton} onconfirmmessage={handleWarningConfirmation}  onclosemessage={handleCancel}></c-add-product-warning-lwc>
            </template> 
        <template if:false={messages.warningMessageAvailable}>   
            <template if:true={messages.saveOLISuccessMessageAvailable}> 
                    <div class="slds-grid slds-wrap slds-text-align_center"><div class="slds-col slds-size_1-of-1"><p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.saveOLISuccessMessage}' class="slds-text-color_success" style="font-weight: bold"></lightning-formatted-text></p> </div></div>
            </template>
            <!--<c-search-service-appointments work-order-id={parentId}></c-search-service-appointments>
            <lightning-card title="Choose Service Appointment">
                <p>Opp or Work Order: {parentId}</p>
                <lightning-record-picker
                    label="Service Appointment"
                    object-api-name="ServiceAppointment"
                    display-info={displayInfo}
                    filter={filter}
                    onchange={handleAppointmentSelection}
                    >
                </lightning-record-picker>
            </lightning-card>-->
            <lightning-card title="Add Product">
                <div class="slds-var-m-around_medium" title="Selected Items to Swap" style="width: 1000px">
                    <template if:true={selectedOLIDataAvailable}> 
                        <c-oli-paginator-lwc oli-records={selectedOLIData} onprevious={handlePrevious}  onnext={handleNext}> </c-oli-paginator-lwc> 
                    </template>
                </div>
                <div class="slds-grid  slds-wrap" style="display: flex; min-width: initial; max-width: 1000px">
                        <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-1 slds-large-size_1-of-1" style="text-align: center">
                                <template if:true={selectedOLIDataAvailable}>
                                    <lightning-button variant="brand" label="Swap" title="Swap" name="swapItems" onclick={handleSwap} class="slds-var-m-left_x-small"></lightning-button>
                                </template>
                                <lightning-button variant="brand" label="Save" title="Save" name="save"  onclick={handleSave} class="slds-var-m-left_x-small" disabled={selections.saveInProgress}></lightning-button>
                                <lightning-button variant="brand" label="Save &amp; Close" title="Save and Close" name="saveAndClose"  onclick={handleSaveAndClose} class="slds-var-m-left_x-small" disabled={selections.saveInProgress}></lightning-button>
                                <lightning-button variant="brand" label="Cancel" title="Cancel" name="cancelRemoval"  onclick={handleCancel} class="slds-var-m-left_x-small"></lightning-button>
                        </div>
                        <template if:true={messages.saveOLIerrorMessageAvailable}> 
                                <div class="slds-grid slds-wrap" style="margin-left:2%"><div class="slds-col slds-size_1-of-1"><p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.saveOLIErrorMessage}' class="slds-text-color_error" style="font-weight: bold"></lightning-formatted-text></p> </div> </div>
                        </template>  
                </div>
                
                    <lightning-layout multiple-rows="true">
                            <lightning-layout-item padding="around-small" size="12"><lightning-input label="Search" value={searchTerm} onchange={handleSearchKeyChange} type="search" style="min-width: initial; max-width: 600px"></lightning-input></lightning-layout-item>
                            <lightning-layout-item padding="around-small" size="12">
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                        <div class="slds-form-element" title="Functional Rating">  
                                            <label class="slds-form-element__label" for="lightning-button-group-functional-rating">Functional Rating</label>         
                                            <div class="slds-form-element__control">
                                                <lightning-button-group id="lightning-button-group-functional-rating">
                                                    <template for:each={selections.functionalRatings} for:item='functionalRating'>
                                                        <lightning-button-stateful  key={functionalRating.value} label-when-off={functionalRating.value} label-when-on={functionalRating.value} label-when-hover={functionalRating.value} icon-name-when-off="utility:add"
                                                                                    icon-name-when-on="utility:check" icon-name-when-hover="utility:close" data-value={functionalRating.value} selected={functionalRating.selected} onclick={handleFunctionalRatingSelectionChange}>
                                                        </lightning-button-stateful>
                                                    </template>
                                                </lightning-button-group>
                                            </div>
                                        </div>
                                        <div class="slds-form-element" title="Check In Type" style="margin-top: 10px">  
                                                <label class="slds-form-element__label" for="lightning-button-group-check-in-type">Check In Type</label>         
                                                <div class="slds-form-element__control">
                                                    <lightning-button-group id="lightning-button-group-check-in-type">
                                                        <template for:each={selections.checkInTypes} for:item='checkInType'>
                                                            <lightning-button-stateful  key={checkInType.value} label-when-off={checkInType.value} label-when-on={checkInType.value} label-when-hover={checkInType.value} icon-name-when-off="utility:add"
                                                                                        icon-name-when-on="utility:check" icon-name-when-hover="utility:close" data-value={checkInType.value} selected={checkInType.selected} onclick={handleCheckInTypeSelectionChange}>
                                                                                     
                                                            </lightning-button-stateful>
                                                        </template>
                                                    </lightning-button-group>
                                                </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <!--<div class="slds-form-element" title="Hide Reserved Items">
                                                    <lightning-input type="toggle" label="hideReserved" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleHideReservedToggleChange} checked></lightning-input>
                                            </div>-->
                                            
                                            <div class="slds-form-element" title="Available Items Only" style="margin-top: 10px">
                                                    <lightning-input type="toggle" label="Available Only" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleAvailableToggleChange}></lightning-input>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <div class="slds-form-element" title="Exact Product Search">
                                                    <lightning-input type="toggle" label="Exact Search" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleExactSearchToggleChange}></lightning-input>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </lightning-layout-item>
                        <lightning-accordion allow-multiple-sections-open active-section-name={pageSettings.activeSections}>
                            <lightning-accordion-section name="filterSection" label="Filter" style="min-width: initial; max-width: 1000px">
                                <lightning-layout-item padding="around-small" size="12">
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <div class="slds-form-element" title="Domestic Options">
                                                    <lightning-input type="toggle" label="Domestic" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleDomesticToggleChange} checked></lightning-input>
                                            </div>
                                        </div>

                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <div class="slds-form-element" title="Product Ownership">  
                                                <label class="slds-form-element__label" for="lightning-button-group-product-ownership">Product Ownership</label>         
                                                <div class="slds-form-element__control">
                                                    <lightning-button-group id="lightning-button-group-product-ownership">
                                                        <template for:each={selections.productOwnerships} for:item='productOwnership'>
                                                        <lightning-button-stateful key={productOwnership.value} label-when-on={productOwnership.value}  label-when-hover={productOwnership.value} icon-name-when-off="utility:add" icon-name-when-on="utility:check"                                                        label-when-off={}
                                                                icon-name-when-hover="utility:close" data-value={productOwnership.value} selected={productOwnership.selected} onclick={handleProductOwnershipSelectionChange}>
                                                        </lightning-button-stateful>
                                                        </template>
                                                    </lightning-button-group>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <div class="slds-form-element" title="Product Location">  
                                                <label class="slds-form-element__label" for="lightning-button-group-product-location">Product Location</label>         
                                                <div class="slds-form-element__control">
                                                    <lightning-button-group id="lightning-button-group-product-location">
                                                        <template for:each={selections.productLocations} for:item='productLocation'>
                                                        <lightning-button-stateful key={productLocation.value} label-when-on={productLocation.value}  label-when-hover={productLocation.value} icon-name-when-off="utility:add" icon-name-when-on="utility:check" label-when-off={productLocation.value}
                                                                icon-name-when-hover="utility:close" data-value={productLocation.value} selected={productLocation.selected} onclick={handleProductLocationSelectionChange}>
                                                        </lightning-button-stateful>
                                                        </template>
                                                    </lightning-button-group>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                            <div class="slds-form-element" title="Product Family">  
                                                <label class="slds-form-element__label" for="lightning-button-group-product-family">Product Family</label>         
                                                <div class="slds-form-element__control">
                                                    <lightning-button-group id="lightning-button-group-product-family">
                                                        <template for:each={selections.productFamilies} for:item='productFamily'>
                                                        <lightning-button-stateful key={productFamily.value} label-when-on={productFamily.value}  label-when-hover={productFamily.value} icon-name-when-off="utility:add" icon-name-when-on="utility:check" label-when-off={productFamily.value}
                                                                icon-name-when-hover="utility:close" data-value={productFamily.value} selected={productFamily.selected} onclick={handleProductFamilySelectionChange}>
                                                        </lightning-button-stateful>
                                                        </template>
                                                    </lightning-button-group>
                                                </div>
                                            </div>
                                        </div>

                                        
                                    </div>
                                </lightning-layout-item>
                                <lightning-layout>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            <div class="slds-form-element" title="Review Status">
                                                    <label class="slds-form-element__label">Review Status</label>  
                                                    <template if:true={reviewStatusPicklistValues.data}>
                                                        <div class="slds-form-element__control">   
                                                            <template for:each={reviewStatusPicklistValues.data.values} for:item="revStatus">
                                                                <lightning-input placeholder="Review Status" key={revStatus.value} label={revStatus.label} data-value={revStatus.value} type="checkbox" onchange={handleReviewStatusSelectionChange}></lightning-input>
                                                            </template>
                                                        </div>  
                                                    </template>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout-item size="6" padding="horizontal-small">
                                            <div class="slds-form-element" title="Cosmetic Rating">
                                                    <label class="slds-form-element__label">Cosmetic Rating</label>  
                                                    <template if:true={cosmeticRatingPicklistValues.data}>
                                                        <div class="slds-form-element__control">   
                                                            <template for:each={cosmeticRatingPicklistValues.data.values} for:item="cosRating">
                                                                <lightning-input placeholder="Cosmetic Rating" key={cosRating.value} label={cosRating.label} data-value={cosRating.value} type="checkbox"  onchange={handleCosmeticRatingSelectionChange}></lightning-input>
                                                            </template>
                                                        </div>  
                                                    </template>
                                            </div>
                                        </lightning-layout-item>
                                    </lightning-layout>
                                    <!-- NEW FILTERS-->
                                    <template if:true={partsOnlySearch}>
                                    <lightning-record-edit-form object-api-name="Product2">
                                        <lightning-layout style="padding-top: 2%;">
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input type="toggle" label="Include Compatible Parts" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleCompatiblePartsToggleChange} checked></lightning-input>

                                            </lightning-layout-item>
                                            
                                        </lightning-layout>
                                        <lightning-layout>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="OEM__c" onchange={handleOEMSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="Part_Type__c" onchange={handlePartTypeSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                        </lightning-layout> 
                                        <lightning-layout> 
                                            <lightning-layout-item size="6" padding="horizontal-small"> 
                                                <lightning-input-field field-name="Modality__c" onchange={handleModalitySelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <div class="slds-form-element" title="Spacer"></div>
                                            </lightning-layout-item>
                                        </lightning-layout> 
                                        <div style="padding-top: 1%;">
                                            <lightning-button class="slds-section__title-action" icon-position="left" variant="base" label="Compatitble System" ></lightning-button>
                                        </div>
                                        <lightning-layout >
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="Compatible_System_OEM__c" onchange={handleCompatibleSystemOEMSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="Compatible_System_Family__c" onchange={handleCompatibleSystemFamilySelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                        </lightning-layout> 
                                        <lightning-layout> 
                                            <lightning-layout-item size="6" padding="horizontal-small"> 
                                                <lightning-input-field field-name="Compatible_System_Model__c" onchange={handleCompatibleSystemModelSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="Compatible_System_Software_Version__c" onchange={handleCompatibleSystemSoftwareVersionSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                        </lightning-layout> 
                                        <lightning-layout>  
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <lightning-input-field field-name="Compatible_System_BT_Revision_Level__c" onchange={handleCompatibleSystemRevisionLevelSelectionChange}></lightning-input-field>
                                            </lightning-layout-item>
                                            <lightning-layout-item size="6" padding="horizontal-small">
                                                <div class="slds-form-element" title="Spacer"></div>
                                            </lightning-layout-item>
                                    </lightning-layout>
                                    </lightning-record-edit-form>
                                    </template>
                                     <!-- END NEW FILTERS-->
                            </lightning-accordion-section>
                            <lightning-accordion-section name="searchResults" label="Search Results">
                                <lightning-layout-item size="12" flexibility="auto">
                                    <div class="slds-grid slds-wrap">
                                        <div class="slds-form-element"><lightning-formatted-number value='{selectedOLICount}' id="text-input-selected-items-count"></lightning-formatted-number><label class="slds-form-element__label">&nbsp;item(s) selected</label></div>
                                        <template if:true={selectedOLIDataAvailable}>
                                            <div class="slds-form-element">
                                                &nbsp;&nbsp;<lightning-formatted-number value='{swapOLICount}' id="text-input-swap-items-count"></lightning-formatted-number><label class="slds-form-element__label">&nbsp;item(s) swapped</label>
                                            </div> 
                                        </template>
                                    </div>
                                    <lightning-button class="slds-section__title-action" icon-position="left" variant="base" label="Search Results"></lightning-button>

                                    </template>

                                            <template if:true={productDataAvailable}>
                                            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table--header-fixed" style="empty-cells: show; width: 100%;">

                                                            <th class="slds-text-align_right" scope="col" style="width: 3.25rem;" title="Select">

                                                            <th class="" scope="col" title="Asset Number">
                                                                <div class="slds-truncate slds-cell-fixed" title="Asset Number">Asset No</div>

                                                                </th>

                                                                </th>
                                                            </template>
                                                            <template if:true={partsOnlySearch}>
                                                            <th class="" scope="col" title="sub_location__c">
                                                                <div class="slds-truncate slds-cell-fixed" title="Sublocation">Sublocation</div>
                                                            </th>
                                                            </template>
                                                            <template if:true={partsOnlySearch}>
                                                                <th class="" scope="col" title="Part_Sug_Pr_Ex">
                                                                    <div class="slds-truncate slds-cell-fixed" title="PartsSugPrEx">PartsSugPrEx</div>
                                                                </th>
                                                            </template>
                                                            <template if:true={partsOnlySearch}>
                                                                <th class="" scope="col" title="Part_Sug_Pr_Out">
                                                                    <div class="slds-truncate slds-cell-fixed" title="PartsSugPrOut">PartsSugPrOut</div>
                                                                </th>
                                                            </template>
                                                            
                                                            <th class="" scope="col" title="Vendor Name">

                                                                    <div class="slds-truncate slds-cell-fixed" title="Check In Type">Check In Type</div>

                                                                    <div class="slds-truncate slds-cell-fixed" title="Pur.Appr.">Pur.Appr.</div>
                                                                </th>

                                                                </th>
                                                                <th class="" scope="col" title="sub_location__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="Sublocation">Sublocation</div>
                                                                </th>
                                                            </template>
                                                            <template if:true={columnSettings.showFunctionalRatingColumn}>
                                                                <th class="" scope="col" title="functional_rating__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="FuncRate">FuncRate</div>
                                                                </th>
                                                            </template>
                                                            <template if:true={columnSettings.showCosmeticRatingColumn}>
                                                                <th class="" scope="col" title="cosmetic_rating__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="CosRate">CosRate</div>
                                                                </th>
                                                            </template>

                                                                <th class="" scope="col" title="price__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="Price">Price</div>

                                                                <th class="" scope="col" title="retail_pr_out__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="RetailPrOut">RetailPrOut</div>

                                                            </template>
                                                            <template if:true={columnSettings.showRetailPrExColumn}>
                                                                <th class="" scope="col" title="retail_pr_ex__c">
                                                                    <div class="slds-truncate slds-cell-fixed" title="RetailPrEx">RetailPrEx</div>

                                                            </template>
