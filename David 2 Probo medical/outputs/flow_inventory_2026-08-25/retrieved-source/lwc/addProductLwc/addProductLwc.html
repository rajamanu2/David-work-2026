<template>
    <lightning-tabset>
        <template if:true={showOLISelectionPage}>
            <template if:false={hideSpinner}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:true={hideSpinner}>
                <template if:true={messages.permissionsErrorMessageAvailable}>
                        <div class="slds-col slds-size_1-of-1">
                                <p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.permissionsErrorHeader}' class="slds-text-color_error" style="font-weight: bold"></lightning-formatted-text></p>          
                                <p class="slds-text-body_regular"><lightning-formatted-text value='{messages.permissionsErrorMessage}' class="slds-text-color_error"></lightning-formatted-text></p>          
                        </div> 
                        <div class="slds-col slds-size_1-of-1" style="text-align: center">
                                <lightning-button variant="brand" label="Cancel" title="Cancel" name="cancelRemoval"  onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                        </div>  
                </template> 
                <template if:false={messages.permissionsErrorMessageAvailable}>
                    <lightning-tab label="Opportunity Line Item">
                            <c-oli-selection-lwc 
                                opportunity-id='{opportunityId}'
                                onsuccessoliselection={handleOLISelection}
                                onoliselectioncomplete={handleOLISelectionComplete}>
                            </c-oli-selection-lwc>
                    </lightning-tab>
                </template>
            </template>   
        </template>    
        <template if:true={showAddProductPage}>
            <template if:false={hideSpinner}>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
            <template if:true={hideSpinner}>
                <template if:true={messages.permissionsErrorMessageAvailable}>
                    <div class="slds-grid slds-wrap" style="margin-left:2%">
                            <div class="slds-col slds-size_1-of-1">
                                <p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.permissionsErrorHeader}' class="slds-text-color_error" style="font-weight: bold"></lightning-formatted-text></p>          
                                <p class="slds-text-body_regular"><lightning-formatted-text value='{messages.permissionsErrorMessage}' class="slds-text-color_error"></lightning-formatted-text></p>          
                            </div>        
                            <div class="slds-col slds-size_1-of-1" style="text-align: center">
                                    <lightning-button variant="brand" label="Cancel" title="Cancel" name="cancelRemoval"  onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                            </div>  
                        </div> 
                </template> 
                <template if:false={messages.permissionsErrorMessageAvailable}>   
                    <template if:true={messages.saveOLISuccessMessageAvailable}> 
                            <div class="slds-grid slds-wrap slds-text-align_center">
                                    <div class="slds-col slds-size_1-of-1">
                                            <p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.saveOLISuccessMessage}' class="slds-text-color_success" style="font-weight: bold"></lightning-formatted-text></p>          
                                    </div>        
                            </div>  
                    </template>
                    <lightning-tab label="Add Product">
                        <div class="slds-m-around_medium" title="Selected Items to Swap" style="width: 1000px">
                            <template if:true={selectedOLIDataAvailable}> 
                                <c-oli-paginator-lwc 
                                    oli-records={selectedOLIData}
                                    onprevious={handlePrevious}
                                    onnext={handleNext}>
                                </c-oli-paginator-lwc>    
                            </template>
                        </div>
                        <div class="slds-grid  slds-wrap" style="display: flex; min-width: initial; max-width: 1000px">
                                <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-1 slds-large-size_1-of-1" style="text-align: center">
                                        <template if:true={selectedOLIDataAvailable}>
                                            <lightning-button variant="brand" label="Swap" title="Swap" name="swapItems" onclick={handleSwap} class="slds-m-left_x-small"></lightning-button>
                                        </template>
                                        <lightning-button variant="brand" label="Save" title="Save" name="save"  onclick={handleSave} class="slds-m-left_x-small" disabled={selections.saveInProgress}></lightning-button>
                                        <lightning-button variant="brand" label="Save &amp; Close" title="Save and Close" name="saveAndClose"  onclick={handleSaveAndClose} class="slds-m-left_x-small" disabled={selections.saveInProgress}></lightning-button>
                                        <lightning-button variant="brand" label="Cancel" title="Cancel" name="cancelRemoval"  onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                                </div>
                                <template if:true={messages.saveOLIerrorMessageAvailable}> 
                                        <div class="slds-grid slds-wrap" style="margin-left:2%">
                                                <div class="slds-col slds-size_1-of-1">
                                                        <p class="slds-text-heading_medium" style="font-weight: bold"><lightning-formatted-text value='{messages.saveOLIErrorMessage}' class="slds-text-color_error" style="font-weight: bold"></lightning-formatted-text></p>          
                                                </div>        
                                        </div>  
                                </template>  
                        </div>
                        <lightning-card>
                            <lightning-layout multiple-rows="true">
                                    <lightning-layout-item padding="around-small" size="12">
                                        <lightning-input label="Search" value={searchTerm} onchange={handleSearchKeyChange} type="search" style="min-width: initial; max-width: 600px"></lightning-input>
                                    </lightning-layout-item> 
                                    <lightning-layout-item padding="around-small" size="12">
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                                <div class="slds-form-element" title="Functional Rating">  
                                                    <label class="slds-form-element__label" for="lightning-button-group-functional-rating">Functional Rating</label>         
                                                    <div class="slds-form-element__control">
                                                        <lightning-button-group id="lightning-button-group-functional-rating">
                                                            <template for:each={selections.functionalRatings} for:item='functionalRating'>
                                                                <lightning-button-stateful  key={functionalRating.value} label-when-off={functionalRating.value} label-when-on={functionalRating.value} label-when-hover={functionalRating.value} icon-name-when-off="utility:add"
                                                                                            icon-name-when-on="utility:check" icon-name-when-hover="utility:close" data-value={functionalRating.value} selected={functionalRating.selected} onclick={handleFunctionalRatingSelectionChange}>
                                                                </lightning-button-stateful>
                                                            </template>
                                                        </lightning-button-group>
                                                    </div>
                                                </div>
                                                <div class="slds-form-element" title="Check In Type" style="margin-top: 10px">  
                                                        <label class="slds-form-element__label" for="lightning-button-group-check-in-type">Check In Type</label>         
                                                        <div class="slds-form-element__control">
                                                            <lightning-button-group id="lightning-button-group-check-in-type">
                                                                <template for:each={selections.checkInTypes} for:item='checkInType'>
                                                                    <lightning-button-stateful  key={checkInType.value} label-when-off={checkInType.value} label-when-on={checkInType.value} label-when-hover={checkInType.value} icon-name-when-off="utility:add"
                                                                                                icon-name-when-on="utility:check" icon-name-when-hover="utility:close" data-value={checkInType.value} selected={checkInType.selected} onclick={handleCheckInTypeSelectionChange}>
                                                                    </lightning-button-stateful>
                                                                </template>
                                                            </lightning-button-group>
                                                        </div>
                                                </div>
                                            </div>
                                        </div>
                                    </lightning-layout-item>
                                <lightning-accordion allow-multiple-sections-open active-section-name={pageSettings.activeSections}>
                                    <lightning-accordion-section name="filterSection" label="Filter" style="min-width: initial; max-width: 1000px">
                                        <lightning-layout-item padding="around-small" size="12">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                                    <div class="slds-form-element" title="Domestic Options">
                                                            <lightning-input type="toggle" label="Domestic" message-toggle-active="Yes"  message-toggle-inactive="No" onchange={handleDomesticToggleChange} checked></lightning-input>
                                                    </div>
                                                </div>
                                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-large-size_1-of-1">
                                                    <div class="slds-form-element" title="Product Family">  
                                                        <label class="slds-form-element__label" for="lightning-button-group-product-family">Product Family</label>         
                                                        <div class="slds-form-element__control">
                                                            <lightning-button-group id="lightning-button-group-product-family">
                                                                <template for:each={selections.productFamilies} for:item='productFamily'>
                                                                <lightning-button-stateful key={productFamily.value}
                                                                    label-when-off={productFamily.value}
                                                                    label-when-on={productFamily.value}
                                                                    label-when-hover={productFamily.value}
                                                                    icon-name-when-off="utility:add"
                                                                    icon-name-when-on="utility:check"
                                                                    icon-name-when-hover="utility:close"
                                                                    data-value={productFamily.value}
                                                                    selected={productFamily.selected}
                                                                    onclick={handleProductFamilySelectionChange}>
                                                                </lightning-button-stateful>
                                                                </template>
                                                            </lightning-button-group>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </lightning-layout-item>
                                        <lightning-layout>
                                                <lightning-layout-item size="6" padding="horizontal-small">
                                                    <div class="slds-form-element" title="Review Status">
                                                            <label class="slds-form-element__label">Review Status</label>  
                                                            <template if:true={reviewStatusPicklistValues.data}>
                                                                <div class="slds-form-element__control">   
                                                                    <template for:each={reviewStatusPicklistValues.data.values} for:item="revStatus">
                                                                        <lightning-input placeholder="Review Status" key={revStatus.value} label={revStatus.label} data-value={revStatus.value} type="checkbox" onchange={handleReviewStatusSelectionChange}></lightning-input>
                                                                    </template>
                                                                </div>  
                                                            </template>
                                                    </div>
                                                </lightning-layout-item>
                                                <lightning-layout-item size="6" padding="horizontal-small">
                                                    <div class="slds-form-element" title="Cosmetic Rating">
                                                            <label class="slds-form-element__label">Cosmetic Rating</label>  
                                                            <template if:true={cosmeticRatingPicklistValues.data}>
                                                                <div class="slds-form-element__control">   
                                                                    <template for:each={cosmeticRatingPicklistValues.data.values} for:item="cosRating">
                                                                        <lightning-input placeholder="Cosmetic Rating" key={cosRating.value} label={cosRating.label} data-value={cosRating.value} type="checkbox"  onchange={handleCosmeticRatingSelectionChange}></lightning-input>
                                                                    </template>
                                                                </div>  
                                                            </template>
                                                    </div>
                                                </lightning-layout-item>
                                            </lightning-layout>
                                    </lightning-accordion-section>
                                    <lightning-accordion-section name="searchResults" label="Search Results">
                                        <lightning-layout-item size="12" flexibility="auto">
                                            <div class="slds-grid slds-wrap">
                                                <div class="slds-form-element">
                                                    <lightning-formatted-number value='{selectedOLICount}' id="text-input-selected-items-count"></lightning-formatted-number><label class="slds-form-element__label">&nbsp;item(s) selected</label>
                                                </div>
                                                <template if:true={selectedOLIDataAvailable}>
                                                    <div class="slds-form-element">
                                                        &nbsp;&nbsp;<lightning-formatted-number value='{swapOLICount}' id="text-input-swap-items-count"></lightning-formatted-number><label class="slds-form-element__label">&nbsp;item(s) swapped</label>
                                                    </div> 
                                                </template>
                                            </div>
                                            <lightning-button class="slds-theme_base slds-section__title-action" icon-position="left" variant="base" label="Search Results"></lightning-button>
                                            <template if:true={messages.searchResultsMessageAvailable}> 
                                                <div class="slds-grid slds-wrap" style="margin-left:2%">
                                                        <div class="slds-col slds-size_1-of-1">
                                                                <p class="slds-text-heading_small"><lightning-formatted-text value='{messages.searchResultsMessage}' class="slds-text-color_default"></lightning-formatted-text></p>          
                                                        </div>        
                                                </div>  
                                            </template>  
                                            <div class="slds-table--header-fixed_container" style='{dynamicTableClass}'>      
                                                <div class="slds-scrollable_y" style="height:100%;">
                                                    <template if:true={productDataAvailable}>
                                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table--header-fixed" style="empty-cells: show; width: 100%;">
                                                        <thead>  
                                                            <template if:true={isSalesOpportunity}>
                                                                <tr class="slds-line-height_reset">
                                                                    <th class="slds-text-align_right" scope="col" style="width: 3.25rem;" title="Select">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Item Selection">&nbsp;</div>
                                                                    </th>
                                                                    <th class="slds-text-align_right" scope="col" style="width: 3.25rem;" title="Select">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Information">&nbsp;</div>
                                                                    </th>
                                                                    <th class="" scope="col" title="Asset Number">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Asset Number">Asset No</div>
                                                                    </th>
                                                                    <th class="" scope="col" title="Product Name">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Product Name">Name</div>
                                                                    </th>
                                                                    <th class="" scope="col" title="Link to Image">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Link to Image">Image</div>
                                                                    </th>
                                                                    <template if:true={columnSettings.showCheckInTypeColumn}>
                                                                        <th class="" scope="col" title="check_in_type__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Check In Type">Check In Type</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showReservedColumn}>
                                                                        <th class="" scope="col" title="reserved__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Reserved" >Reserved</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPurchasingApprovedColumn}>
                                                                        <th class="" scope="col" title="purchasing_approved__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Pur.Appr.">Pur.Appr.</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showLocationColumn}>
                                                                        <th class="" scope="col" title="location__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Location">Location</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showFunctionalRatingColumn}>
                                                                        <th class="" scope="col" title="functional_rating__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="FuncRate">FuncRate</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showCosmeticRatingColumn}>
                                                                        <th class="" scope="col" title="cosmetic_rating__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="CosRate">CosRate</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPriceColumn}>
                                                                        <th class="" scope="col" title="price__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Price">Price</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSugPrOutColumn}>
                                                                        <th class="" scope="col" title="sug_pr_out__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="SugPrOut">SugPrOut</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSugPrExColumn}>
                                                                        <th class="" scope="col" title="sug_pr_ex__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="SugPrEx">SugPrEx</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showStdCostOutColumn}>
                                                                        <th class="" scope="col" title="std_cost_out__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="StdCostOut">StdCostOut</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showStdCostExColumn}>
                                                                        <th class="" scope="col" title="std_cost_ex__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="StdCostEx">StdCostEx</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSugPrWithSystemColumn}>
                                                                        <th class="" scope="col" title="sug_price_with_system__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="SugPrWithSystem">SugPrWithSystem</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showNewSugPrOutColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="NewSugPrOut">NewSugPrOut</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showNewSugPrExColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="NewSugPrEx">NewSugPrEx</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showNewStdCostOutColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="NewStdCostOut">NewStdCostOut</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showNewStdCostExColumn}>
                                                                        <th class="" scope="col" >
                                                                            <div class="slds-truncate slds-cell-fixed" title="NewStdCostEx">NewStdCostEx</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPropSTDWholeslPrColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Prop STD Wholesl Pr">Prop STD Wholesl Pr</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPropSTDRefurbColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Prop STD Refurb">Prop STD Refurb</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPropSTDRetailColumn}>
                                                                        <th class="" scope="col">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Prop STD Retail">Prop STD Retail</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSpecialOfferColumn}>
                                                                        <th class="" scope="col" title="special_offer_pricing__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Special Offer">Special Offer</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showCompatibleSystemColumn}>
                                                                            <th class="" scope="col" title="compatible_system__c">
                                                                                <div class="slds-truncate slds-cell-fixed" title="Compatible System">Compatible System</div>
                                                                            </th>
                                                                    </template>
                                                                    <th class="" scope="col" title="Exchange">
                                                                        <div class="slds-truncate slds-cell-fixed" title="Exchange">Exchange</div>
                                                                    </th>
                                                                    <template if:true={columnSettings.showReviewStatusColumn}>
                                                                            <th class="" scope="col" title="review_status__c">
                                                                                <div class="slds-truncate slds-cell-fixed" title="Review Status">Review Status</div>
                                                                            </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSerialNumberColumn}>
                                                                        <th class="" scope="col" title="serial_no__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Serial #">Serial #</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showPartNumberColumn}>
                                                                        <th class="" scope="col" title="part_number__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Part #">Part #</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSysSoftColumn}>
                                                                        <th class="" scope="col" title="system_software__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="SysSoft">SysSoft</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showDOMColumn}>
                                                                        <th class="" scope="col" title="date_of_manufacture__c">
                                                                            <div class="slds-truncate slds-cell-fixed" title="DOM">DOM</div>
                                                                        </th>
                                                                    </template>
                                                                    <template if:true={columnSettings.showSystemTestColumn}>
                                                                        <th class="" scope="col" title="d_system_test__c" >
                                                                            <div class="slds-truncate slds-cell-fixed">SystemTest for -D</div>
                                                                        </th>
                                                                    </template>
                                                                </tr>  
                                                            </template> 
                                                            <template if:false={isSalesOpportunity}>
                                                                    <tr class="slds-line-height_reset">
                                                                        <th class="slds-text-align_right" scope="col" style="width: 3.25rem;" title="Select">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Item Selection">&nbsp;</div>
                                                                        </th>
                                                                        <th class="slds-text-align_right" scope="col" style="width: 3.25rem;" title="Select">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Information">&nbsp;</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Asset Number">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Asset Number">Asset No</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Product Name">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Product Name">Name</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Link to Image">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Link to Image">Image</div>
                                                                        </th>
                                                                        <template if:true={columnSettings.showCompatibleSystemColumn}>
                                                                            <th class="" scope="col" title="compatible_system__c">
                                                                                <div class="slds-truncate slds-cell-fixed" title="Compatible System">Compatible System</div>
                                                                            </th>
                                                                        </template>
                                                                        <th class="" scope="col" title="Exchange">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Exchange">Exchange</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Quantity">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Quantity">Quantity</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Probo's Offer">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Probo's Offer">Probo's Offer</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Supplier's Quote">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Supplier's Quote">Supplier's Quote</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Avg Probo Offer">
                                                                            <div class="slds-truncate slds-cell-fixed" title="Avg Probo Offer">Avg Probo Offer</div>
                                                                        </th>
                                                                        <th class="" scope="col" title="Avg Supplier Offer">
