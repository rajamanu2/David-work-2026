<template>
    <lightning-layout-item size=12>
        <div class="slds-table--header-fixed_container" style="height:300px;">      
            <div class="slds-scrollable_y" style="height:100%;">
                <template if:true={swapOLIDataAvailable}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table--header-fixed">
                    <thead>  
                        <tr>
                            <th class="" scope="col"><div class="slds-truncate slds-cell-fixed" title="Asset Number">Original Asset No</div></th>
                            <th class="" scope="col"><div class="slds-truncate slds-cell-fixed" title="Product Name">Original Product Name</div></th>
                            <th class="" scope="col"><div class="slds-truncate slds-cell-fixed" title="Compatible System">Swapped Asset No</div></th>
                            <th class="" scope="col"><div class="slds-truncate slds-cell-fixed" title="Product Name">Swapped Product Name</div></th>
                        </tr>  
                    </thead>
                    <tbody>
                        <template for:each={swapOLIRecords} for:item='item'>
                                <tr class="slds-hint-parent" key={item.id}>
                                    <template if:true={hasOLISwapData}>
                                        <td data-label="Original Asset Number">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.originData.Asset_No__c}'></lightning-formatted-text></div>
                                        </td>
                                        <td data-label="Original Product Name">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.originData.Product_Name__c}'></lightning-formatted-text></div>
                                        </td>
                                    </template>
                                    <template if:true={hasAssetSwapData}>
                                        <td data-label="Original Asset Number">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.originData.Name}'></lightning-formatted-text></div>
                                        </td>
                                        <td data-label="Original Product Name">
                                            <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.originData.Product2_Name__c}'></lightning-formatted-text></div>
                                        </td>
                                    </template>
                                    <td data-label="Original Asset Number">
                                        <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.swapData.Name}'></lightning-formatted-text></div>
                                    </td>
                                    <td data-label="Original Product Name">
                                        <div class="slds-truncate" key={item.id}><lightning-formatted-text value='{item.swapData.Product_Name__r.Name}'></lightning-formatted-text></div>
                                    </td>  
                                </tr>    
                        </template>
                    </tbody>  
                </table>
                </template>
            </div>
        </div>
    </lightning-layout-item>
</template>
